name: Terraform Validate

on:
  push:
    branches: [ main ]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Run Terraform Validate
        run: terraform validate
